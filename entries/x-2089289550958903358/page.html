<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Thermal Receipt — Paper Studies</title>
  
  <style>
:root {
  color-scheme: light;
  --stage: #eeedeb;
  --ink: #211f1b;
  --muted: #66635e;
  --accent: #a65022;
  --rule: #d7d4cf;
  --mono: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  --gutter: clamp(19px, 4.25vw, 72px);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--stage);
  color: var(--ink);
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; }
button { font: inherit; }

.caption {
  font: 500 10px/1.45 var(--mono);
  letter-spacing: .11em;
  text-transform: uppercase;
  color: var(--muted);
}

.masthead, .colophon {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-inline: var(--gutter);
}

.masthead { min-height: clamp(53px, 8.4vh, 80px); border-bottom: 1px solid var(--rule); gap: 10px; }
.wordmark { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 670; letter-spacing: -.025em; }
.wordmark svg { width: 24px; height: 24px; flex: none; }
.edition, .section-label { display: flex; align-items: center; gap: 9px; }
.edition > span { color: var(--ink); }
.edition i { width: 14px; height: 1px; background: #a39d94; }

.stage {
  --printer-width: clamp(248px, calc((100svh - 288px) * .7265), 340px);
  width: min(100% - var(--gutter) * 2, 1152px);
  margin-inline: auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, var(--printer-width)) minmax(0, 1fr);
  align-items: center;
  gap: clamp(18px, 4vw, 69px);
  padding: 28px 0 31px;
}

.instructions { justify-self: end; align-self: center; width: min(100%, 240px); padding-bottom: 62px; }
.section-label { color: var(--accent); }
.section-label i { width: 13px; height: 1px; background: currentColor; }
h1 { margin: 15px 0 12px; font-size: clamp(31px, 4.2vw, 64px); font-weight: 620; line-height: .99; letter-spacing: -.063em; }
.instructions p { margin: 0; color: #5d5953; font-size: 13px; line-height: 1.6; }

.counter { width: 100%; display: grid; justify-items: center; align-self: center; }
.printer-label { display: flex; align-items: center; gap: 7px; margin-bottom: 13px; letter-spacing: .15em; }
.printer-label i { width: 6px; height: 6px; border: 1px solid #b3704b; border-radius: 50%; }
[data-state="ready"] .printer-label i, [data-state="tearing"] .printer-label i { background: #b16438; }
.printer { width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#ink { font-family: var(--mono); }
.shop-name { font-size: 22px; font-weight: 750; letter-spacing: 1.3px; }
.shop-subtitle { font-size: 9.5px; font-weight: 600; letter-spacing: 2.7px; }
.receipt-rule { fill: none; stroke: #6d6861; stroke-width: .7px; stroke-dasharray: 2 2; }
.receipt-meta { font-size: 9.25px; letter-spacing: .35px; }
.receipt-items { font-size: 11px; }
.receipt-total { font-size: 15px; font-weight: 750; }
.thanks { font-size: 10px; }
.barcode-label { font-size: 8.5px; letter-spacing: 1.6px; }
.edge-marks { opacity: 0; transition: opacity 180ms ease; pointer-events: none; }
[data-state="ready"] .edge-marks { opacity: 1; }
.edge-arrows { stroke: #9d522c; stroke-width: .95; stroke-linecap: round; stroke-linejoin: round; }
.edge-ticks { stroke: #aba59b; stroke-width: .75; stroke-linecap: round; }
#grip { cursor: grab; outline: none; }
#grip:focus-visible { stroke: #a65022; stroke-width: 2px; stroke-dasharray: 5 4; }
[data-state="tearing"] #grip { cursor: grabbing; }

#reprint {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  min-width: 113px;
  margin-top: 3px;
  padding: 8px 16px;
  border: 1px solid #c9c5be;
  border-radius: 7px;
  background: #f7f6f4;
  color: var(--ink);
  box-shadow: 0 1px 2px #3129180a;
  font-size: 13px;
  font-weight: 620;
  cursor: pointer;
  transition: background-color 150ms, border-color 150ms, transform 150ms;
}
#reprint:hover { background: white; border-color: #aaa39a; }
#reprint:active { transform: translateY(1px); }
#reprint:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.specimen { display: grid; gap: 8px; justify-self: start; padding: 0 0 60px 13px; position: relative; }
.specimen::before { content: ''; position: absolute; top: 3px; left: 0; width: 1px; height: 43px; background: #c8c3bb; }
.specimen-index { color: var(--accent); }
.colophon { border-top: 1px solid var(--rule); min-height: clamp(39px, 6.6vh, 62px); }
.divider { padding-inline: 2px; color: #8b847a; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (max-width: 765px) {
  .stage {
    --printer-width: clamp(215px, calc((100svh - 262px) * .7265), 302px);
    grid-template-columns: minmax(0, 1fr);
    align-content: center;
    justify-items: center;
    gap: 19px;
    padding: 17px 0 18px;
  }
  .instructions { justify-self: center; width: auto; padding-bottom: 0; text-align: center; }
  .section-label { display: none; }
  h1 { margin: 0 0 5px; font-size: clamp(24px, 7vw, 35px); letter-spacing: -.065em; }
  h1 br, .instructions p br { display: none; }
  .instructions p { font-size: 12px; line-height: 1.4; }
  .counter { width: min(100%, var(--printer-width)); }
  .specimen { display: none; }
  .printer-label { margin-bottom: 8px; }
}

@media (max-height: 640px) and (min-width: 766px) {
  .stage { --printer-width: clamp(205px, calc((100svh - 195px) * .7265), 315px); padding-block: 13px; }
  .printer-label { margin-bottom: 7px; }
}

@media (max-width: 765px) and (max-height: 650px) {
  .stage { gap: 12px; padding-block: 11px; }
  .colophon { min-height: 35px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; }
}

</style>
</head>

  <script>
(() => {
  'use strict';

  const W = 264;
  const H = 432;
  const SLOT = 10;
  const STEPS = 112;
  const STRIPS = 22;
  const NS = 'http://www.w3.org/2000/svg';
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const $ = (id) => document.getElementById(id);
  const stage = document.querySelector('.stage');
  const printer = $('printer');
  const active = $('active-sheet');
  const paper = $('paper-outline');
  const print = $('printed-content');
  const stub = $('stub');
  const stubEdge = $('stub-edge');
  const slotShade = $('slot-shade');
  const grip = $('grip');
  const falling = $('falling-sheet');
  const snap = $('snap-fibres');
  const reprint = $('reprint');
  const clamp = (v, low = 0, high = 1) => Math.min(high, Math.max(low, v));
  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = (t) => t * t * (3 - 2 * t);
  const xy = (p) => p.map((v) => v.toFixed(2)).join(' ');
  const trace = (points) => 'M' + points.map(xy).join('L');
  const outline = (points) => trace(points) + 'Z';
  const path = (node, d) => node.setAttribute('d', d);
  const svg = (tag, attrs, parent) => {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    parent.append(node);
    return node;
  };

  const baseTop = [[0, 0], [W, 0]];
  const bottom = [[W, H - 1.35]];
  for (let x = W - 2.2, i = 0; x > 0; x -= 2.2, i++) bottom.push([x, i % 2 ? H - 1.35 : H]);
  bottom.push([0, H - 1.35]);
  const flatSheet = outline([...baseTop, ...bottom]);
  const labels = { feeding: 'Printing', ready: 'Ready to tear', tearing: 'Tearing', torn: 'Receipt taken' };
  const defs = printer.querySelector('defs');
  const strips = Array.from({ length: STRIPS }, (_, i) => {
    const y = (i * H) / STRIPS;
    const h = H / STRIPS;
    const id = 'mesh-strip-' + i;
    const clip = svg('clipPath', { id }, defs);
    svg('rect', { x: 0, y: y - 0.14, width: W, height: h + 0.28 }, clip);
    const layer = svg('g', {}, $('paper-mesh'));
    const band = svg('g', { 'clip-path': 'url(#' + id + ')' }, layer);
    svg('use', { href: '#fall-source' }, band);
    const shade = svg('rect', { 'clip-path': 'url(#cut-clip)', x: 0, y, width: W, height: h + 0.2, fill: '#554535', opacity: 0 }, band);
    return { layer, shade, y, h };
  });

  let number = 0;
  let state;
  let frame = 0;
  let lastFrame = 0;
  let feedStart = 0;
  let drag;
  let tear;
  let drop;
  let lean = 0;
  let stretch = 0;
  let opening = 22;
  let gripFocus = false;

  function setState(next, message = '') {
    state = next;
    stage.dataset.state = next;
    $('status').textContent = labels[next];
    if (message) $('announcement').textContent = message;
    const canGrip = next === 'ready' || next === 'tearing';
    grip.setAttribute('tabindex', canGrip ? '0' : '-1');
    grip.style.pointerEvents = canGrip ? '' : 'none';
    grip.setAttribute('aria-disabled', canGrip ? 'false' : 'true');
  }

  function setTicket() {
    const serial = String(++number).padStart(4, '0');
    $('ticket').textContent = serial;
    $('barcode-label').textContent = 'GB · ' + serial;
    const digits = ['nnnwwnwnn', 'wnnwnnnnw', 'nnwwnnnnw', 'wnwwnnnnn', 'nnnwwnnnw', 'wnnwwnnnn', 'nnwwwnnnn', 'nnnwnnwnw', 'wnnwnnwnn', 'nnwwnnwnn'];
    const star = 'nwnnwnwnn';
    const patterns = [star, ...Array.from(serial, (digit) => digits[Number(digit)]), star];
    const width = (value) => value === 'w' ? 3.16 : 1.32;
    const length = patterns.flatMap((p) => [...p]).reduce((sum, value) => sum + width(value), 1.32 * (patterns.length - 1));
    let x = (W - length) / 2;
    let bars = '';
    for (const pattern of patterns) {
      [...pattern].forEach((value, i) => {
        const size = width(value);
        if (i % 2 === 0) bars += 'M' + x.toFixed(2) + ' 363h' + size + 'v27h-' + size + 'z';
        x += size;
      });
      x += 1.32;
    }
    path($('barcode'), bars);
  }

  let stopped = false;
  let stopTime = 0;
  let offset = 0;
  window.marketScene = { pause(value) {
    if (value === stopped) return;
    stopped = value;
    if (stopped) {
      stopTime = performance.now(); cancelAnimationFrame(frame); frame = 0; clearDrag();
    } else {
      offset += performance.now() - stopTime; schedule();
    }
  } };
  function schedule() {
    if (!stopped && !frame) frame = requestAnimationFrame(tick);
  }

  function clearDrag() {
    if (!drag) return;
    const id = drag.id;
    drag = null;
    if (grip.hasPointerCapture(id)) grip.releasePointerCapture(id);
  }

  function startPrint() {
    clearDrag();
    tear = null;
    drop = null;
    lean = stretch = 0;
    opening = 22;
    gripFocus = false;
    lastFrame = 0;
    feedStart = 0;
    setTicket();
    path(stub, '');
    path(stubEdge, '');
    path(grip, '');
    path(paper, flatSheet);
    print.removeAttribute('transform');
    falling.setAttribute('display', 'none');
    active.removeAttribute('display');
    active.setAttribute('transform', 'translate(0 ' + (-H - 3) + ')');
    slotShade.setAttribute('visibility', 'hidden');
    snap.replaceChildren();
    setState('feeding', 'Printing receipt.');
    schedule();
  }

  function showFeed(now) {
    if (!feedStart) feedStart = now;
    const phase = clamp((now - feedStart - 130) / (motion.matches ? 390 : 1440));
    const travel = phase < .88 ? phase / .94 : mix(.88 / .94, 1, 1 - Math.pow(1 - (phase - .88) / .12, 2));
    const ripple = motion.matches ? 0 : Math.sin(phase * Math.PI * 18) * Math.sin(phase * Math.PI) * 1.8;
    const offset = (H + 3) * (travel - 1) + ripple;
    active.setAttribute('transform', 'translate(0 ' + offset.toFixed(2) + ')');
    slotShade.setAttribute('visibility', offset < -H ? 'hidden' : 'visible');
    if (phase === 1) {
      active.removeAttribute('transform');
      path(grip, flatSheet);
      setState('ready', 'Receipt ready to tear.');
    } else schedule();
  }

  function newTear(side) {
    return { side, points: [], progress: 0, target: 0, roughness: 0, seed: Math.random() * 80, drift: 0 };
  }

  function addToCut(span) {
    const points = tear.points;
    const required = Math.ceil(span / W * STEPS);
    while (points.length <= required) {
      const i = points.length;
      const d = i * W / STEPS;
      const rough = tear.roughness;
      tear.drift = mix(tear.drift, rough, .34);
      const flutter = Math.sin(i * .63 + tear.seed) * 2.05 + Math.sin(i * .22 + tear.seed * 2) * 1.28;
      const random = (Math.random() - .5) * 2;
      const y = SLOT + (i % 2 ? -.44 : .44) + tear.drift * (flutter + random * 1.36);
      const tip = i > 0 && rough > .44 && Math.random() < .27 * rough;
      const fibre = tip ? (Math.random() < .55 ? -1 : 1) * mix(1.55, 3.45, Math.random()) : 0;
      points.push({ d, y, fibre });
    }
  }

  function cutAt(progress) {
    const span = progress * W;
    addToCut(span);
    const contour = [];
    const push = (d, y) => contour.push([tear.side === 'left' ? d : W - d, y, d]);
    const points = tear.points;
    push(0, points[0].y);
    for (let i = 1; i < points.length; i++) {
      const { d, y, fibre } = points[i];
      const before = points[i - 1];
      const start = d - 1.22;
      const fibrePoints = fibre ? [
        [start, mix(before.y, y, (start - before.d) / (d - before.d))],
        [start + .63, mix(before.y, y, (start + .63 - before.d) / (d - before.d)) + fibre],
        [start + .86, mix(before.y, y, (start + .86 - before.d) / (d - before.d))]
      ] : [];
      let previous = [before.d, before.y];
      for (const point of [...fibrePoints, [d, y]]) {
        if (point[0] >= span) {
          push(span, mix(previous[1], point[1], (span - previous[0]) / (point[0] - previous[0])));
          return contour;
        }
        push(...point);
        previous = point;
      }
    }
    return contour;
  }

  function currentPose() {
    const progress = tear ? tear.progress : 0;
    const sign = tear?.side === 'right' ? -1 : 1;
    const pulled = opening * progress;
    return {
      lean,
      scale: 1 + stretch,
      shear: -sign * pulled / W,
      shift: sign > 0 ? pulled : 0,
      gap: opening
    };
  }

  function renderAttached(pose) {
    let top = baseTop;
    const progress = tear ? tear.progress : 0;
    const transform = ([x, y]) => [x + pose.lean * y, pose.shift + pose.shear * x + pose.scale * y];
    if (progress > 0) {
      const cut = cutAt(progress);
      const span = progress * W;
      const start = cut[0][0];
      const end = cut[cut.length - 1][0];
      const far = W - start;
      const lip = cut.map(([x, y]) => [x, y]);
      path(stub, outline([[start, 0], [end, 0], ...lip.slice().reverse()]));
      path(stubEdge, trace(lip));
      top = cut.map(([x, y, d]) => [x + pose.lean * y, pose.scale * y + pose.gap * (span - d) / W]);
      if (progress < 1) top.push([end, 0], [far, 0]);
      if (tear.side === 'right') top.reverse();
    }
    const shape = outline([...top, ...bottom.map(transform)]);
    path(paper, shape);
    path(grip, shape);
    print.setAttribute('transform', 'matrix(1 ' + pose.shear + ' ' + pose.lean + ' ' + pose.scale + ' 0 ' + pose.shift + ')');
  }

  function moveCut(dt) {
    const bend = drag ? drag.bend : 0;
    const strain = drag ? drag.strain : 0;
    const damping = 1 - Math.exp(-dt / 46);
    lean = mix(lean, bend, damping);
    stretch = mix(stretch, strain, damping);
    const tension = drag || tear?.target === 1 ? 35 : 22;
    opening = mix(opening, tension, damping);
    if (tear && tear.progress < tear.target) {
      const speed = motion.matches ? .006 : mix(.00265, .0046, tear.roughness);
      tear.progress = Math.min(tear.target, tear.progress + Math.min(dt * speed, .11));
    }
    const pose = currentPose();
    renderAttached(pose);
    if (tear?.progress === 1) return releaseSheet(pose);
    if (tear && tear.progress === tear.target && !drag) {
      setState('ready');
    }
    if (drag || (tear && tear.progress < tear.target) || Math.abs(lean) > .00035 || Math.abs(stretch) > .00035 || Math.abs(opening - tension) > .05) schedule();
  }

  function releaseSheet(pose) {
    const cut = cutAt(1).map(([x, y]) => [x, y]);
    if (tear.side === 'right') cut.reverse();
    path($('released-outline'), outline([...cut, ...bottom]));
    const tip = tear.side === 'left' ? cut[cut.length - 1] : cut[0];
    const sign = tear.side === 'left' ? 1 : -1;
    const focus = gripFocus || document.activeElement === grip;
    clearDrag();
    gripFocus = false;
    if (focus) reprint.focus({ preventScroll: true });
    const fibres = Array.from({ length: tear.roughness > .45 ? 9 : 5 }, (_, i) => {
      const node = svg('path', { stroke: '#fff', 'stroke-width': .65 + Math.random() * .4, 'stroke-linecap': 'round' }, snap);
      return { node, vx: (i - 2.5) * 17 * sign, vy: -23 - 45 * Math.random(), length: 1.2 + Math.random() * 1.7 };
    });
    drop = { time: null, pose, sign, tip, fibres, pace: motion.matches ? 325 : 1050 };
    active.setAttribute('display', 'none');
    falling.removeAttribute('display');
    path(grip, '');
    setState('torn', 'Receipt torn off. Select Reprint for a new receipt.');
    renderFall(0);
    schedule();
  }

  function renderFall(time) {
    const { sign, pose, tip, pace, fibres } = drop;
    const t = clamp(time / pace);
    const impact = Math.sin(Math.PI * clamp(time / 104));
    const curl = motion.matches ? 0 : Math.sin(Math.PI * Math.pow(t, .75)) * clamp(t * 7);
    const yaw = curl * (.93 + .27 * Math.sin(t * 7));
    const spin = sign * curl * (-.17 + .16 * Math.sin(t * 8));
    const cs = Math.cos(spin);
    const sn = Math.sin(spin);
    const fallY = (motion.matches ? 38 : 492) * t * t + 5 * t;
    const slideX = sign * (13 * t - 3 * impact);
    const opacity = 1 - smooth(clamp((t - (motion.matches ? .03 : .63)) / (motion.matches ? .9 : .35)));
    falling.setAttribute('opacity', opacity);

    function row(y) {
      const u = y / H;
      const depth = Math.sin(u * 4.45 - t * 3.9);
      const bend = curl * (depth * 20 - 74 * u * u);
      const width = Math.cos(yaw * (.82 + .18 * depth)) * (1 + curl * .08 * depth);
      const pitch = sign * curl * (.16 * depth + .045);
      const centerX = W / 2 + pose.lean * y + sign * curl * depth * 14;
      const centerY = y * pose.scale + pose.shift + pose.shear * W / 2 + bend;
      const px = centerX - W / 2;
      const py = centerY - H * .48;
      return [
        cs * px - sn * py + W / 2 + slideX,
        sn * px + cs * py + H * .48 + fallY + 1.9 * impact,
        cs * width - sn * (pitch + pose.shear),
        sn * width + cs * (pitch + pose.shear)
      ];
    }

    for (const { layer, shade, y, h } of strips) {
      const [x0, y0] = row(y);
      const [x1, y1] = row(y + h);
      const [, , a, b] = row(y + h / 2);
      const c = (x1 - x0) / h;
      const d = (y1 - y0) / h;
      layer.setAttribute('transform', 'matrix(' + [a, b, c, d, x0 - a * W / 2 - c * y, y0 - b * W / 2 - d * y].map((v) => v.toFixed(4)).join(' ') + ')');
      shade.setAttribute('opacity', curl * (.055 + .051 * Math.cos(y / H * 4.45 - t * 3.9)));
    }

    for (const { node, vx, vy, length } of fibres) {
      const seconds = time / 1000;
      const x = tip[0] + vx * seconds;
      const y = tip[1] + vy * seconds + 280 * seconds * seconds;
      path(node, 'M' + xy([x, y]) + 'l' + xy([-vx * .013, length]));
      node.setAttribute('opacity', 1 - clamp(time / 155));
    }
  }

  function showDrop(now) {
    if (drop.time === null) drop.time = now;
    renderFall(now - drop.time);
    if (now - drop.time < drop.pace) schedule();
    else {
      falling.setAttribute('display', 'none');
      snap.replaceChildren();
      drop = null;
    }
  }

  function tick(timestamp) {
    const now = timestamp - offset;
    const dt = lastFrame ? clamp(now - lastFrame, 1, 27) : 16;
    lastFrame = now;
    frame = 0;
    if (state === 'feeding') showFeed(now);
    else if (drop) showDrop(now);
    else if (state === 'ready' || state === 'tearing') moveCut(dt);
  }

  function startGrip(event) {
    if (drag || (state !== 'ready' && state !== 'tearing') || event.button !== 0 || tear?.target === 1) return;
    event.preventDefault();
    const bounds = printer.getBoundingClientRect();
    const unit = 340 / bounds.width;
    drag = {
      id: event.pointerId, x: event.clientX, y: event.clientY, unit,
      side: (event.clientX - bounds.left) * unit < 170 ? 'left' : 'right',
      base: tear?.target || 0, lastTime: event.timeStamp,
      lastPull: 0, lastAdvance: 0, velocity: 0, bend: 0, strain: 0
    };
    grip.setPointerCapture(event.pointerId);
    setState('tearing');
    schedule();
  }

  function trackGrip(event) {
    if (!drag || drag.id !== event.pointerId) return;
    const dx = (event.clientX - drag.x) * drag.unit;
    const dy = (event.clientY - drag.y) * drag.unit;
    const pull = Math.max(0, dy + Math.abs(dx) * .44);
    const resistance = drag.base ? 9 : 15;
    const elapsed = Math.max(8, event.timeStamp - drag.lastTime);
    const delta = pull - drag.lastPull;
    if (delta > .1) {
      drag.velocity = Math.max(delta / elapsed, drag.velocity * Math.exp(-elapsed / 44));
      drag.lastAdvance = event.timeStamp;
    }
    drag.lastTime = event.timeStamp;
    drag.lastPull = pull;
    drag.bend = clamp(dx * .54 / H, -.048, .048);
    drag.strain = Math.min(.011, pull / 6200);
    const target = clamp(drag.base + (pull - resistance) / 104);
    if (pull > resistance && target > (tear?.target || 0)) {
      if (!tear) tear = newTear(drag.side);
      tear.target = target;
      tear.roughness = clamp((drag.velocity - .53) / 1.1);
    }
    schedule();
  }

  function endGrip(event) {
    if (!drag || drag.id !== event.pointerId) return;
    if (event.type === 'pointerup') {
      trackGrip(event);
      const kinetic = drag.velocity * Math.exp(-(event.timeStamp - drag.lastAdvance) / 58);
      if (tear && drag.lastPull > 38 && kinetic > .85 && tear.target < 1) {
        tear.target = clamp(tear.target + Math.min(.52, kinetic * .21));
        tear.roughness = Math.max(tear.roughness, clamp((kinetic - .53) / 1.1));
      }
    }
    clearDrag();
    schedule();
  }

  grip.addEventListener('pointerdown', startGrip);
  grip.addEventListener('pointermove', trackGrip);
  grip.addEventListener('pointerup', endGrip);
  grip.addEventListener('pointercancel', endGrip);
  grip.addEventListener('lostpointercapture', endGrip);
  grip.addEventListener('keydown', (event) => {
    if (![' ', 'Enter'].includes(event.key) || event.repeat || state !== 'ready') return;
    event.preventDefault();
    if (!tear) tear = newTear('left');
    tear.target = 1;
    gripFocus = true;
    setState('tearing');
    schedule();
  });
  reprint.addEventListener('click', startPrint);
  startPrint();
})();

</script>
</body>
</html>
